<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Темный фон (как на скрине) -->
  <rect width="32" height="32" rx="6" fill="#1a1a1a"/>
  
  <!-- Шампур / линия -->
  <line x1="4" y1="16" x2="28" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Два желтых круга (еда) -->
  <circle cx="11" cy="16" r="4.5" fill="#ffcc66"/>
  <circle cx="19" cy="16" r="4.5" fill="#ffcc66"/>
  
  <!-- Буква D, нанизанная на шампур -->
  <path d="M 23 11.5 L 23 20.5 M 23 11.5 C 26 11.5 28 13.5 28 16 C 28 18.5 26 20.5 23 20.5" 
        stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
